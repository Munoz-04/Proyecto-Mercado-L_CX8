<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Libre - Inicio</title>
    <style>
        body {
            margin: 0;
            background: #ffe600;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 500px;
            margin: 60px auto 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px 30px 30px 30px;
            text-align: center;
            position: relative;
        }
        .logo {
            width: 200px;
            margin-bottom: 30px;
        }
        .country-select {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            font-size: 1.2em;
            font-weight: bold;
            transition: background 0.1s;
            padding: 8px 18px;
            border-radius: 8px;
        }
        .country-select:hover {
            background: #ffe60044;
        }
        .country-flag {
            width: 36px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #ccc;
            object-fit: cover;
        }
        .shipping-info {
            position: absolute;
            top: 18px;
            right: 24px;
            background: #f5f5f5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95em;
            color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="shipping-info" style="display: flex; align-items: center; gap: 8px; background: linear-gradient(90deg, #fffbe6 60%, #ffe600 100%); box-shadow: 0 2px 8px rgba(255,230,0,0.08); font-weight: 600;">
            <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="Envío" style="width:20px; height:20px; vertical-align:middle;">
            Envío a <span style="color:#3483fa;">Santo Domingo</span>
        </div>
        <img class="logo" src="./image.png" alt="Mercado Libre Logo">
        <a class="country-select" id="rd-link" href="./RDominicana/index.html">
            <img class="country-flag" src="./RDominicana/RD.png" alt="Bandera República Dominicana">
            República Dominicana
        </a>
        <a class="country-select" id="gt-link" href="./mercado Guatemala/index.html">
            <img class="country-flag" src="./mercado Guatemala/image.png" alt="Bandera Guatemala">
            Guatemala
        </a>
        <a class="country-select" id="ec-link" href="./mercado ecuador/index.html">
            <img class="country-flag" src="./mercado ecuador/image.png" alt="Bandera Ecuador">
            Ecuador
        </a>
    </div>
</body>
</html>
