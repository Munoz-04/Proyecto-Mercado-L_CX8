<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Libre costa rica copia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <img src="https://http2.mlstatic.com/frontend-assets/ml-web-navigation/ui-navigation/6.5.2/mercadolibre/logo__large_plus.png" alt="mercado libre">
            <input type="text" placeholder="Buscar productos, marcas y más...">
            <img src="./img/arriba derecha.png"  style="height:1px;">
        </div>
        <nav>
            <img id="ubicacion" src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="ubicacion" style="height:30px;"> 
            <span>Costa Rica</span>
            <ul>
                <li>Categorías</li>
                <li>Ofertas</li>
                <li>Cupones</li>
                <li>Supermercado</li>
                <li>Moda</li>
                <li>Vender</li>
                <li>Ayuda / PQR</li>
            </ul>
            <ul>
                <li>Crea tu cuenta</li>
                <li>Ingresa</li>
                <li>Mis Compras</li>
                <img src="https://cdn-icons-png.flaticon.com/512/107/107831.png" alt="carrito" style="height:30px;">
            </ul>
        </nav>
    </header>
    <main>
        <div class="slider" id="slider">
            <img src="./img/crica/crica slider.png" class="slide-img active" alt="slide 1">
            <button class="slider-btn prev" onclick="prevSlide()">&#10094;</button>
            <button class="slider-btn next" onclick="nextSlide()">&#10095;</button>
        </div>
        <div class="container">
          <img src="./img/crica/celulares y telefonos.png" alt="" class="">
          <img src="./img/crica/recibe tus compras.png" alt="" class="">
          <img src="./img/crica/ingresa a tu cuenta.png" alt="" class="">
          <img src="./img/crica/nuestras categorias.png" alt="" class="">
          <img src="./img/crica/zapatillas.png" alt="" class="">
          <img src="./img/crica/vende con nosotros.png" alt="" class="">
        </div>
        <div class="cuadro">
          <img src="./img/crica/cuadro grande.png" alt="">
        </div>
        <footer>
          <img src="./img/crica/compra sin moverte.png" alt="">
        </footer>
        
    <script src="main.js"></script>
        
</body>

</html>
